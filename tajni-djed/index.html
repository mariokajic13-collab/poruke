<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tajni Djed Božićnjak 2026 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2a22;--card:#fbf6ec;--ink:#2a1d14;--red:#b3261e;--green:#1f6f4a;--gold:#d4a017;--muted:#7a6a5c;--line:#e2d6c0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,#1f5242,var(--bg) 70%);background-color:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
header{text-align:center;color:#fbf6ec;padding:30px 16px 6px;position:relative;z-index:1}
h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(30px,8vw,48px);margin:0;letter-spacing:-.5px;line-height:1.1}
.sub{margin:6px 0 0;color:#e8d9b5;opacity:.85}
main{max-width:640px;margin:0 auto;padding:8px 14px 110px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
main>section:empty{display:none}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
h2{font-family:Fraunces,serif;font-size:22px;margin:4px 0 12px;line-height:1.25}
h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--green)}
p{line-height:1.5;margin:0 0 10px}
.muted{color:var(--muted)}
.center{text-align:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--green);color:#fff;cursor:pointer;transition:transform .08s;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--red)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid #d9cdb8}
.btn.big{font-size:18px;padding:16px 20px;width:100%;margin-bottom:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin:6px 0}
.row input{flex:1;min-width:0}
input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid #d9cdb8;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--gold);border-color:transparent}
.pill{background:rgba(255,255,255,.12);color:#fbf6ec;border-radius:99px;padding:6px 12px;font-size:13px;width:fit-content;margin:0 auto}
.pill.ok{color:#bff0cf}
.note{background:#fff3d6;border-radius:14px;padding:12px 14px;color:#6b4b10;line-height:1.5}
.mebar{color:#fbf6ec;text-align:center;font-size:15px}
.link{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;opacity:.85;padding:0 4px}
.mebar .link{color:#e8d9b5}
.mebar .muted{color:#cfc0a0;display:block;margin-top:4px}
.tag{display:inline-block;background:#efe5d2;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700;margin-bottom:6px}
.big{font-family:Fraunces,serif;font-size:28px;font-weight:800;margin:4px 0 8px}
/* Teaser */
.teaser{text-align:center;color:#fbf6ec;padding:6px 0}
.teaser .gift{font-size:76px}
.teaser h2{font-size:clamp(26px,7vw,36px);color:#fbf6ec;margin:6px 0 4px}
.cdl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#e8d9b5;opacity:.85;margin:16px 0 10px}
.cdg{display:flex;justify-content:center;gap:10px}
.cdg div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;min-width:72px;padding:12px 6px}
.cdg b{display:block;font-family:Fraunces,serif;font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cdg span{font-size:12px;color:#e8d9b5}
.msg{min-height:52px;margin:20px auto 6px;max-width:420px;font-size:17px;font-weight:600;color:#f5e3b0;transition:opacity .5s}
.crew{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0}
.cw{font:inherit;font-size:14px;color:#fbf6ec;background:rgba(255,255,255,.12);border:1.5px solid transparent;border-radius:99px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cw:disabled{cursor:default}
.cw.on{border-color:rgba(47,179,107,.7)}
.cw i{width:8px;height:8px;border-radius:50%;background:#2fb36b;box-shadow:0 0 6px #2fb36b}
.cw.me{background:var(--gold);color:#3a2a00;font-weight:700}
.tcard{background:rgba(251,246,236,.96);color:var(--ink);border-radius:18px;padding:16px 18px;text-align:left;margin-top:16px}
.tcard p:last-child{margin:0}
.hostbar{margin-top:16px;border:2px dashed var(--gold);border-radius:16px;padding:12px;color:#fbf6ec;font-size:14px}
.hostbar .btn{margin:6px 4px 0}
/* Spiel */
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nm{font:inherit;font-weight:700;font-size:15px;padding:14px 6px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.nm:hover:not(:disabled){border-color:var(--gold)}
.nm.sel{background:var(--red);color:#fff;border-color:var(--red)}
.nm:disabled{opacity:.4;cursor:default}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.mode:hover{border-color:var(--gold)}
.mode:last-child{grid-column:1/-1}
.mode .e{font-size:26px}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.35}
.wheelwrap{position:relative;max-width:330px;margin:14px auto 6px}
.wheel{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:34px;color:var(--gold);text-shadow:0 2px 0 #7a5a00;z-index:2}
.dicebox{text-align:center;margin:8px 0}
.dice{font-size:84px;line-height:1.05;margin-bottom:10px;letter-spacing:6px}
.opts{display:grid;gap:8px}
.opt{font:inherit;font-size:16px;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.sel{background:#fbe7a6;border-color:var(--gold);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:#efe5d2;border-radius:99px;padding:5px 11px;font-size:13.5px}
.chip.ok{background:#cfe9d9}
.lanes{margin:12px 0}
.lane{position:relative;height:42px;border-bottom:2px dashed #e2d6c0;margin-bottom:4px}
.lane .ln{position:absolute;left:0;top:2px;font-size:12px;font-weight:700;color:var(--muted)}
.lane .deer{position:absolute;bottom:2px;font-size:28px;transition:left .15s linear;transform:translateX(-50%) scaleX(-1)}
.lane.me .ln{color:var(--red)}
.lane .flag{position:absolute;right:0;bottom:4px;font-size:22px}
.tap{font-size:26px!important;padding:26px!important;user-select:none;-webkit-user-select:none}
.go{font-family:Fraunces,serif;font-size:72px;font-weight:800;text-align:center;color:var(--red);min-height:86px}
.bomb{font-size:110px;text-align:center;line-height:1.1;animation:shake .5s infinite}
.bomb.hot{animation-duration:.15s}
@keyframes shake{25%{transform:rotate(-8deg) scale(1.04)}75%{transform:rotate(8deg) scale(.97)}}
.holder{text-align:center;font-family:Fraunces,serif;font-size:30px;font-weight:800;color:var(--red)}
.winner{text-align:center;padding:8px 0 4px}
.gift{font-size:68px;animation:bounce 1.2s ease-in-out infinite}
.wn{font-family:Fraunces,serif;font-size:clamp(34px,9vw,46px);color:var(--red);font-weight:800;line-height:1.1}
.wn.small{font-size:24px;color:var(--ink)}
.you{margin-top:10px;display:inline-block;background:var(--gold);color:#3a2a00;font-weight:800;border-radius:99px;padding:6px 14px}
.task{background:#1f6f4a;color:#fff;border-radius:16px;padding:14px 16px;margin:14px 0 4px;text-align:center}
.task small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;opacity:.8;margin-bottom:4px}
.task b{font-size:18px;line-height:1.35}
@keyframes bounce{50%{transform:translateY(-8px) rotate(-4deg)}}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
table.res td{padding:7px 4px;border-top:1px solid #ece2cf}
table.res td:last-child{text-align:right;color:var(--muted)}
table.res tr.win td{font-weight:700;color:var(--red)}
ol.order{margin:10px 0 0;padding-left:22px;line-height:1.8}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ece2cf}
.plist li:first-child{border-top:0}
.plist .pn{flex:1}
.plist li.done .pn{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#cbbfa9;flex:none}
.dot.on{background:#2fb36b;box-shadow:0 0 0 3px rgba(47,179,107,.2)}
.dot.man{background:transparent;border:1.5px dashed #b9ab92}
.host{border:2px dashed var(--gold)}
.manage{margin-top:14px;border-top:1px solid #ece2cf;padding-top:10px}
.manage summary{cursor:pointer;color:var(--muted);font-weight:600}
.mlist{list-style:none;padding:0;margin:8px 0}
.mlist li{padding:5px 0;display:flex;justify-content:space-between}
.mlist .link{color:var(--red)}
.err{color:var(--red);font-size:14px}
.rx{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(14,42,34,.9);border:1px solid rgba(255,255,255,.18);padding:6px;border-radius:99px;z-index:8;backdrop-filter:blur(6px)}
.rx button{font-size:24px;background:none;border:0;cursor:pointer;padding:4px 8px;border-radius:99px;touch-action:manipulation}
.rx button:active{background:rgba(255,255,255,.15)}
.fly{position:fixed;bottom:70px;font-size:38px;pointer-events:none;z-index:9;animation:fly 2.6s ease-out forwards}
.fly small{display:block;font-size:11px;color:#fff;text-align:center;font-weight:700;text-shadow:0 1px 2px #000}
@keyframes fly{to{transform:translateY(-60vh) scale(1.3);opacity:0}}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snow i{position:absolute;top:-20px;color:#fff;opacity:.55;font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#snow{display:none}.gift,.bomb{animation:none}}
</style>
</head>
<body>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
// ================= Sadržaj =================
const NAMES=["Ana","Mario B.","Mario K.","Mari","Mladenko","Gordana","Ilona","Jelena","Bozo"];
const TARGET=new Date('2026-12-24T20:00:00+01:00');
const GOAL=60;
const MODES={
  wheel:{t:"Kolo sreće",e:"🎡",d:"Kolo odlučuje – čista sreća."},
  race:{t:"Utrka sobova",e:"🦌",d:"Tapkaj što brže možeš – prvi sob na cilju otvara!"},

  surprise:{t:"Iznenađenje",e:"🎁",d:"Nasumična igra – ni voditelj ne zna koja."}
};
const QE=[
  {q:"Koje je godine prvi put izvedena pjesma „Tiha noć“?",a:1818},
  {q:"Koliko darova ukupno ima u pjesmi „The Twelve Days of Christmas“ – svih 12 dana zajedno?",a:364},
  {q:"Koje je godine film „Sam u kući“ došao u kina?",a:1990},
  {q:"Koje je godine izašla pjesma „Last Christmas“ grupe Wham!?",a:1984},
  {q:"Koje je godine izašla pjesma „All I Want for Christmas Is You“ Mariah Carey?",a:1994},
  {q:"Koje je godine Charles Dickens objavio „Božićnu priču“?",a:1843},
  {q:"Koje je godine snimljen film „Tri lješnjaka za Pepeljugu“?",a:1973},

  {q:"Koliko sekundi ima Božić (24 sata)?",a:86400}
];
const QQ=[
  {q:"Koji sob ima poznati crveni nos?",o:["Rudolf","Komet","Blitzen","Dasher"],c:0},
  {q:"U kojoj se zemlji za Božić tradicionalno ide u KFC?",o:["SAD","Japan","Južna Koreja","Australija"],c:1},
  {q:"Tko je napisao tekst pjesme „Tiha noć“?",o:["Franz Xaver Gruber","Joseph Mohr","Martin Luther","J. S. Bach"],c:1},
  {q:"Tko u Italiji 6. siječnja donosi djeci darove?",o:["Befana","Babbo Natale","Sveti Martin","Strega Nona"],c:0},
  {q:"Kada je Sveti Nikola?",o:["1. prosinca","6. prosinca","13. prosinca","24. prosinca"],c:1},
  {q:"Kako se u Rusiji zove „Djed Božićnjak“?",o:["Ded Moroz","Djadja Snega","Babuška","Sveti Ivan"],c:0},
  {q:"Što se u Hrvatskoj tradicionalno jede na Badnjak?",o:["Sarma","Bakalar","Ćevapi","Purica"],c:1},
  {q:"U kojoj se zemlji svake godine postavlja golemi slameni jarac iz Gävlea?",o:["Norveška","Finska","Švedska","Danska"],c:2},
  {q:"Koliko svijeća ima klasični adventski vijenac?",o:["3","4","5","24"],c:1},
  {q:"U kojoj je zemlji nastala „Tiha noć“?",o:["Njemačka","Švicarska","Austrija","Češka"],c:2},
  {q:"Što se tradicionalno sije na Svetu Luciju (13.12.) za Božić?",o:["Pšenica","Kukuruz","Grah","Riža"],c:0},
  {q:"Koliko krakova ima pahulja?",o:["4","5","6","8"],c:2},
  {q:"Što se na Badnjak tradicionalno unosi u kuću i stavlja na vatru?",o:["Badnjak (cjepanica)","Bor","Imela","Božikovina"],c:0},
  {q:"Koji je grad tri godine zaredom proglašen najboljim adventom u Europi?",o:["Beč","Zagreb","Prag","Budimpešta"],c:1}
];
const TASKS=[
  "Otvori dar bez korištenja palčeva.",
  "Prije otvaranja 20 sekundi opisuj dar kao voditelj TV prodaje.",
  "Prvo naglas pogodi što je unutra – tek onda otvaraj.",
  "Otvaraj usporeno – uz dramatičnu glazbu koju sam pjevušiš.",
  "Ocijeni ambalažu kao žiri: ocjena od 1 do 10, uz obrazloženje.",
  "Otvori i reagiraj kao da si upravo dobio/la na lotu.",
  "Otvaraj zatvorenih očiju i pogodi dar samo dodirom.",
  "Održi kratki govor zahvale kao na dodjeli Oscara.",
  "Otvaraj samo jednom rukom – druga ostaje iza leđa.",
  "Otvaraj kao da razminiravaš bombu – najavi svaki pokret.",
  "Obično otvaranje. Imaš sreće! 🍀",
  "Smisli apsurdnu priču o tome odakle dar zapravo dolazi.",
  "Izazov za kameru: drži zamotan dar 5 sekundi skroz blizu kamere – ostali pogađaju što je unutra.",
  "Unboxing kao influencer: „Hej ekipa, dobrodošli na moj kanal …“",
  "Prve tri sekunde otvaraš samo laktovima.",
  "Na kraju pozicioniraj dar u kameru kao za naslovnicu kataloga – i drži pozu 5 sekundi."
];
const MSGS=[
  "Sobovi su na pripremama 🦌",
  "Netko upravo prekomplicirano zamata dar 🎀",
  "Darovna bomba već tiho otkucava … 💣",
  "Kolo sreće se podmazuje. Na mito je imuno. 🎡",
  "Devet tajnih Djedova Božićnjaka. Devet darova. Jedna večer kaosa. 🎄",
  "Savjet: zagrijte palčeve – trebat će vam 👍",
  "Djed Božićnjak hladi server kuhanim vinom 🍷",
  "Pripremite kameru – netko će otvarati dar laktovima 📸"
];
const RX=['🎉','😂','😱','❤️','🔥'];
const COLS=['#b3261e','#1f6f4a','#d4a017','#8e1b1b','#2f8f5b'];
const DIE=['','⚀','⚁','⚂','⚃','⚄','⚅'];

// ================= Stanje =================
let db=null,user=null,isHost=false,myId=null,booted=false,connected=false;
let S=emptyState(),peers=[],hostReady=false,hostErr='',preview=false;
let myNick=ls('nick')||'',myInp=null,myPass=null,myWho=null,raceN=0,raceRid='',raceGo=0,reactN=0;
let editing=false,rolling=false,confirmReset=false,manageOpen=false,heldSince=0,bombTimer=null;
let stageKey='',meKey='',hostKey='',teaserKey='',saving=Promise.resolve();
const seenRx={};

function emptyState(){return{v:0,players:{},removed:[],order:[],phase:"lobby",round:null,result:null,usedQ:{guess:[],quiz:[]},scores:{},open:false}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem('wx_'+k);localStorage.setItem('wx_'+k,v)}catch(e){return null}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf=p=>(S.players[p]&&S.players[p].name)||'Netko';
const pidOf=p=>p.by||(p.presence&&typeof p.presence.uid==='string'&&p.presence.uid.slice(0,40))||p.peer;
const rid=r=>r?r.id+'-'+r.sub:'';
const rnd=n=>Math.floor(Math.random()*n);
const rnd6=()=>1+rnd(6);
const fmt=n=>Number(n).toLocaleString('hr-HR');
const isManual=p=>p.startsWith('m-');
const isOpen=()=>Date.now()>=TARGET.getTime()||!!S.open;
const showGame=()=>isOpen()||(isHost&&preview);
const newId=()=>Math.random().toString(36).slice(2,8);
function remaining(st=S){return Object.keys(st.players).filter(p=>!st.order.includes(p)).sort((a,b)=>(st.players[a].j||0)-(st.players[b].j||0))}
function peerOf(pid){return peers.find(p=>pidOf(p)===pid&&p.presence)}

// ================= Veza (MQTT) =================
const ROOM='ae23faac525f';
const HOST_HASH='505a05e4e824f0889415398b7da737bd0ed17690cbc29e3da208424767b9fbda';
const BROKER=(new URLSearchParams(location.search).get('broker'))||'wss://broker.hivemq.com:8884/mqtt';
const BASE='tajnidjed2026/'+ROOM;
let client=null,myPres={},pubTimer=null;
const presMap={};// id -> {presence,last}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const room={
  presence(p){Object.assign(myPres,p);for(const k in myPres)if(myPres[k]===null)delete myPres[k];schedulePub();return Promise.resolve()},
  emit(topic,data){if(topic==='state'&&client&&client.connected&&isHost)client.publish(BASE+'/state',JSON.stringify(data),{retain:true,qos:1});return Promise.resolve()}
};
function schedulePub(){if(pubTimer)return;pubTimer=setTimeout(publishPres,120)}
function publishPres(){pubTimer=null;if(!client||!client.connected||!Object.keys(myPres).length)return;myPres.t=Date.now();client.publish(BASE+'/p/'+myId,JSON.stringify(myPres),{retain:true,qos:0});presIn(myId,myPres)}
function rebuildPeers(){
  peers=Object.entries(presMap).map(([id,v])=>({peer:id,by:id,isMe:id===myId,sameTab:id===myId,kind:'viewer',guest:false,presence:v.presence}));
}
function presIn(id,pr){
  const prev=presMap[id];
  if(pr===null){if(prev){delete presMap[id];rebuildPeers();afterPeers({joined:[],updated:[],left:[]})}return}
  presMap[id]={presence:Object.freeze(Object.assign({},pr)),last:Date.now()};

function setHostReady(){

  const r=S.round;
  if(S.phase==='play'&&r&&r.mode==='wheel'){const id=r.id;setTimeout(()=>wheelDone(id),2500)}
  if(S.phase==='play'&&r&&r.mode==='bomb'){heldSince=Date.now();armBomb(r.id,5000+rnd(6000))}

}
function commit(mut){
  if(!isHost)return;
  const n=structuredClone(S);mut(n);n.v=(S.v||0)+1;S=n;render();
  room.emit("state",S);
  if(db){const snap=S;saving=saving.then(()=>db.doc("live/state").set(snap)).then(()=>{if(hostErr){hostErr='';hostKey='';render()}}).catch(e=>{hostErr='Spremanje nije uspjelo ('+(e&&e.code||'greška')+') – igra uživo ipak radi.';hostKey='';render()})}
}
function clean(mode,v){
  if(mode==='dice')return Array.isArray(v)&&v.length===2&&v.every(x=>Number.isInteger(x)&&x>=1&&x<=6)?[v[0],v[1]]:undefined;
  if(mode==='guess'){const x=Number(v);return Number.isFinite(x)&&Math.abs(x)<1e10?x:undefined}
  if(mode==='quiz')return Number.isInteger(v)&&v>=0&&v<4?v:undefined;
}
function hostSync(){
  if(!isHost||!hostReady)return;
  const seen={};
  for(const p of peers){
    if(!p.presence)continue;
    const nk=typeof p.presence.nick==='string'?p.presence.nick.trim().slice(0,24):'';
    if(nk)seen[pidOf(p)]={nk,pr:p.presence};
  }
  if(myNick)seen[myId]={nk:myNick,pr:{inp:myInp,pass:myPass,who:myWho,race:raceRid?{rid:raceRid,n:raceN}:null}};
  const add=[],ren=[],inps=[],r=S.round;
  for(const [pid,v] of Object.entries(seen)){
    if(S.removed.includes(pid))continue;
    const cur=S.players[pid];
    if(!cur)add.push([pid,v.nk]);else if(cur.name!==v.nk)ren.push([pid,v.nk]);
    const inp=v.pr.inp;
    if(S.phase==='play'&&r&&['dice','guess','quiz'].includes(r.mode)&&r.active.includes(pid)&&!r.inputs[pid]&&inp&&inp.rid===rid(r)){
      const val=clean(r.mode,inp.val);if(val!==undefined)inps.push([pid,val]);
    }
  }
  if(add.length||ren.length||inps.length){
    const now=Date.now();
    commit(n=>{
      let j=Object.keys(n.players).length;
      add.forEach(([p,nk])=>{
        if(Object.keys(n.players).some(x=>x!==p&&n.players[x].name===nk&&seen[x]))return;
        const man=Object.keys(n.players).find(x=>x!==p&&n.players[x].name===nk);
        if(man){n.players[p]={name:nk,j:n.players[man].j};delete n.players[man];n.order=n.order.map(x=>x===man?p:x);
          if(n.scores[man]){n.scores[p]=n.scores[man];delete n.scores[man]}
          if(n.round){['pool','active'].forEach(k=>{if(n.round[k])n.round[k]=n.round[k].map(x=>x===man?p:x)});['winner','holder','opener','claim'].forEach(k=>{if(n.round[k]===man)n.round[k]=p})}
          if(n.result&&n.result.winner===man)n.result.winner=p;}
        else n.players[p]={name:nk,j:now+(j++)};
      });
      ren.forEach(([p,nk])=>n.players[p].name=nk);
      inps.forEach(([p,val],i)=>n.round.inputs[p]={val,at:now+i});
      autoResolve(n);
    });
  }
  const R=S.round;if(!R)return;
  // Utrka sobova
  if(S.phase==='play'&&R.mode==='race'){
    const fin={};
    for(const [pid,v] of Object.entries(seen)){const rc=v.pr.race;if(rc&&rc.rid===rid(R)&&R.active.includes(pid))fin[pid]=Math.min(GOAL,Math.max(0,+rc.n||0))}
    const w=Object.entries(fin).filter(([,n])=>n>=GOAL)[0];
    if(w)commit(n=>{n.round.final=fin;n.phase='result';n.result={winner:w[0],task:rnd(TASKS.length)}});
  }
  // Darovna bomba
  if(S.phase==='play'&&R.mode==='bomb'){
    const h=seen[R.holder];const ps=h&&h.pr.pass;
    if(ps&&ps.rid===R.id&&ps.k===R.passes)passBomb();
  }
  // Tko je bio tajni Djed?
  if(S.phase==='who'){
    const votes={};let claim=null;
    for(const [pid,v] of Object.entries(seen)){
      const w=v.pr.who;if(!w||w.rid!==R.id||pid===R.opener||!S.players[pid])continue;
      if(w.claim&&!R.claim&&!claim)claim=pid;
      if(typeof w.vote==='string'&&S.players[w.vote]&&w.vote!==R.opener&&!R.votes[pid])votes[pid]=w.vote;
    }
    if(claim||Object.keys(votes).length)commit(n=>{if(claim&&!n.round.claim)n.round.claim=claim;Object.assign(n.round.votes,votes)});
  }
}
function hostTick(){
  if(!isHost||!hostReady)return;
  const r=S.round;
  if(S.phase==='play'&&r&&r.mode==='bomb'){
    const lim=isManual(r.holder)?1500:6000;
    if(Date.now()-heldSince>lim)passBomb();
  }
}
function passBomb(){
  const r=S.round;if(!r||r.mode!=='bomb')return;
  const c=r.active.filter(p=>p!==r.holder);if(!c.length)return;
  heldSince=Date.now();
  commit(n=>{n.round.holder=c[rnd(c.length)];n.round.passes++});
}
function armBomb(id,ms){clearTimeout(bombTimer);bombTimer=setTimeout(()=>{if(S.phase==='play'&&S.round&&S.round.id===id)commit(n=>{n.phase='result';n.result={winner:n.round.holder,task:rnd(TASKS.length)}})},ms)}
function autoResolve(n){
  const r=n.round;if(n.phase!=='play'||!r||!r.inputs)return;
  const all=r.active.every(p=>r.inputs[p]);
  if(all&&r.mode==='dice')evalDice(n);
  if(all&&r.mode==='quiz')resolveQuiz(n);
}
function rollManual(r){const t=Date.now();r.active.filter(isManual).forEach((p,i)=>{if(!r.inputs[p])r.inputs[p]={val:[rnd6(),rnd6()],at:t+i}})}
function evalDice(n){
  const r=n.round;const act=r.active.filter(p=>r.inputs[p]);if(!act.length)return;
  const sum=p=>r.inputs[p].val[0]+r.inputs[p].val[1];
  const max=Math.max(...act.map(sum));const top=act.filter(p=>sum(p)===max);
  if(top.length===1){n.phase='result';n.result={winner:top[0],task:rnd(TASKS.length)}}
  else{r.hist.push({inputs:r.inputs,tie:top});r.sub++;r.active=top;r.inputs={};rollManual(r);autoResolve(n)}
}
function resolveQuiz(n){
  const r=n.round,q=QQ[r.qi];
  const ok=r.active.filter(p=>r.inputs[p]&&r.inputs[p].val===q.c).sort((a,b)=>r.inputs[a].at-r.inputs[b].at);
  n.phase='result';n.result=ok.length?{winner:ok[0],task:rnd(TASKS.length)}:{winner:null,note:"Nitko nije pogodio – novo pitanje!"};
}
function resolveGuess(n){
  const r=n.round,q=QE[r.qi];
  const e=r.active.filter(p=>r.inputs[p]).sort((a,b)=>Math.abs(r.inputs[a].val-q.a)-Math.abs(r.inputs[b].val-q.a)||r.inputs[a].at-r.inputs[b].at);
  n.phase='result';n.result=e.length?{winner:e[0],task:rnd(TASKS.length)}:{winner:null,note:"Nitko nije poslao procjenu."};
}
function pickQ(n,kind,len){
  let used=n.usedQ[kind]||[];if(used.length>=len)used=[];
  const free=[...Array(len).keys()].filter(i=>!used.includes(i));
  const qi=free[rnd(free.length)];n.usedQ[kind]=used.concat(qi);return qi;
}
function startRound(mode){
  if(mode==='surprise')mode=['wheel','race','bomb','dice','guess','quiz'][rnd(6)];
  const pool=remaining();if(pool.length<2)return;
  let active=pool.slice();
  if(['guess','quiz','race'].includes(mode)){active=pool.filter(p=>!isManual(p));if(active.length<1||(mode==='race'&&active.length<2)){mode='wheel';active=pool.slice()}}
  const r={id:newId(),mode,pool,active,sub:0,inputs:{},hist:[]};
  if(mode==='wheel'){r.winner=pool[rnd(pool.length)];r.jit=+(Math.random()*0.7-0.35).toFixed(3);r.turns=6+rnd(3)}
  if(mode==='dice')rollManual(r);
  if(mode==='bomb'){r.holder=active[rnd(active.length)];r.passes=0}
  commit(n=>{
    if(mode==='guess')r.qi=pickQ(n,'guess',QE.length);
    if(mode==='quiz')r.qi=pickQ(n,'quiz',QQ.length);
    n.phase='play';n.round=r;n.result=null;autoResolve(n);
  });
  if(mode==='wheel')setTimeout(()=>wheelDone(r.id),6500);
  if(mode==='bomb'){heldSince=Date.now()+2000;armBomb(r.id,18000+rnd(17000))}
}
function wheelDone(id){if(S.phase==='play'&&S.round&&S.round.id===id)commit(n=>{n.phase='result';n.result={winner:n.round.winner,task:rnd(TASKS.length)}})}
const after=n=>remaining(n).length?'lobby':'done';

function hostAction(a){
  const r=S.round;
  if(a==='last'){const rem=remaining();commit(n=>{n.phase='result';n.round={id:newId(),mode:'last',pool:rem,active:rem,sub:0,inputs:{},hist:[]};n.result={winner:rem[0],task:rnd(TASKS.length),note:"Zadnji dar – pozornica je tvoja!"}})}
  if(a==='resolve'&&r)commit(n=>{if(r.mode==='guess')resolveGuess(n);if(r.mode==='quiz')resolveQuiz(n);if(r.mode==='dice'){n.round.active=n.round.active.filter(p=>n.round.inputs[p]);evalDice(n)}});
  if(a==='abort')commit(n=>{n.phase='lobby';n.round=null;n.result=null});
  if(a==='task')commit(n=>{if(n.result){let t=rnd(TASKS.length);if(t===n.result.task)t=(t+1)%TASKS.length;n.result.task=t}});
  if(a==='opened'||a==='openedSkip')commit(n=>{
    const w=n.result&&n.result.winner;if(w&&!n.order.includes(w))n.order.push(w);n.result=null;
    if(a==='opened'&&w&&Object.keys(n.players).length>2){n.phase='who';n.round={id:newId(),mode:'who',opener:w,votes:{},claim:null,sub:0}}
    else{n.round=null;n.phase=after(n)}
  });
  if(a==='reveal'&&r)commit(n=>{
    const R=n.round;const voters=Object.keys(R.votes).filter(p=>p!==R.claim);
    const right=voters.filter(p=>R.votes[p]===R.claim);
    right.forEach(p=>n.scores[p]=(n.scores[p]||0)+1);
    R.right=right;R.master=voters.length>0&&right.length<voters.length/2;
    if(R.master)n.scores[R.claim]=(n.scores[R.claim]||0)+2;
    n.phase='whores';
  });
  if(a==='next')commit(n=>{n.round=null;n.result=null;n.phase=after(n)});
  if(a==='again'&&r)startRound(r.mode);
  if(a==='finish')commit(n=>{n.phase='done';n.round=null;n.result=null});
  if(a==='reopen')commit(n=>{n.phase='lobby'});
  if(a==='reset'){
    if(!confirmReset){confirmReset=true;render();setTimeout(()=>{confirmReset=false;render()},4000);return}
    confirmReset=false;commit(n=>{n.order=[];n.phase='lobby';n.round=null;n.result=null;n.usedQ={guess:[],quiz:[]};n.scores={}});
  }
}
function claimFor(p){commit(n=>{if(n.round&&n.phase==='who')n.round.claim=p})}
function removePlayer(p){
  commit(n=>{delete n.players[p];if(!n.removed.includes(p))n.removed.push(p);n.order=n.order.filter(x=>x!==p);delete n.scores[p];

    if(R){if(R.pool)R.pool=R.pool.filter(x=>x!==p);if(R.active)R.active=R.active.filter(x=>x!==p);if(R.inputs)delete R.inputs[p];if(R.votes)delete R.votes[p]}
    if(n.phase==='play'&&R&&(R.mode==='wheel'||R.active.length<1||(R.mode==='bomb'&&R.holder===p))){n.phase='lobby';n.round=null}
    else autoResolve(n)});
}

    el.innerHTML=`<div class="card"><h2>${myNick?'Promijeni ime':'Tko si ti?'}</h2><p class="muted">Dodirni svoje ime.</p><div class="names">${NAMES.map(n=>{const t=taken.has(n)&&n!==myNick;return `<button class="nm ${n===myNick?'sel':''}" data-n="${esc(n)}" ${t?'disabled':''}>${esc(n)}${t?' ✓':''}</button>`}).join('')}</div>${myNick?'<button class="link" id="canc" style="margin-top:10px;color:var(--muted)">odustani</button>':''}</div>`;
    el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{myNick=b.dataset.n;ls('nick',myNick);editing=false;pushPresence();if(isHost)hostSync();meKey='';render()});
    const c=$('#canc');if(c)c.onclick=()=>{editing=false;render()};

  }

  else if(!inRoster)sub=hostOn?'<span class="muted">Uskoro ćeš biti dodan/a …</span>':'<span class="muted">Čekamo voditelja igre …</span>';
  el.innerHTML=`<div class="mebar">Igraš kao <b>${esc(myNick)}</b><button class="link" id="edn">promijeni</button>${sub}</div>`;
  $('#edn').onclick=()=>{editing=true;render()};
}

function renderStage(){

  const key=[S.phase,rid(r),res.winner,res.note,res.task,Object.keys(S.players).length,S.order.length,isHost,r&&r.mode==='bomb'?r.holder+'.'+r.passes:'',r&&r.claim].join('|');

}
function orderHTML(){return S.order.length?`<ol class="order">${S.order.map(p=>`<li>${esc(nameOf(p))}</li>`).join('')}</ol>`:''}
function scoresHTML(title){

}
function taskHTML(){const t=S.result&&S.result.task;return Number.isInteger(t)&&TASKS[t]?`<div class="task"><small>📸 Zadatak za otvaranje</small><b>${esc(TASKS[t])}</b></div>`:''}

    return `<div class="card"><div class="big">${S.order.length?'🎁 '+S.order.length+' od '+tot+' otvoreno':'🎄 Svi spremni?'}</div><p class="muted">${isHost?'Odaberi dolje sljedeću igru.':'Voditelj upravo bira sljedeću igru …'}</p>${S.order.length?'<h3>Već otvorili</h3>':''}${orderHTML()}${scoresHTML()}</div>`;

  const amIn=r.active.includes(myId);
  if(S.phase==='play'){
    if(r.mode==='wheel')h+=wheelSVG(r.pool,0)+'<p class="center muted">Kolo se vrti …</p>';
    if(r.mode==='race'){

  h+=w?`<div class="winner">${r.mode==='bomb'?'':'<div class="gift">🎁</div>'}<div class="wn">${esc(nameOf(w))}</div><div>otvara dar!</div>${w===myId?'<div class="you">Ti si na redu! 🎉 Kamera!</div>':''}</div>`
      :`<div class="winner"><div class="wn small">${esc(S.result&&S.result.note||'')}</div></div>`;
  if(w&&S.result.note)h+=`<p class="center muted">${esc(S.result.note)}</p>`;
  if(w)h+=taskHTML();
  h+=resultDetails(r,w);
  return `<div class="card">${h}</div>`;
}
function resultDetails(r,w){
  if(r.mode==='dice'){
    const rows=[];
    r.hist.forEach((hst,k)=>Object.entries(hst.inputs).forEach(([p,i])=>rows.push([p,i.val,k===0?'1. runda':'Doigravanje '+k])));
    const cur=r.sub?'Doigravanje '+r.sub:'';
    Object.entries(r.inputs).forEach(([p,i])=>rows.push([p,i.val,cur]));
    return `<table class="res">${rows.map(([p,v,l])=>`<tr class="${p===w&&l===cur?'win':''}"><td>${esc(nameOf(p))}</td><td>${DIE[v[0]]}${DIE[v[1]]} = ${v[0]+v[1]}</td><td>${l}</td></tr>`).join('')}</table>`;
  }
  if(r.mode==='guess'){
    const q=QE[r.qi];const e=Object.entries(r.inputs).sort((a,b)=>Math.abs(a[1].val-q.a)-Math.abs(b[1].val-q.a));
    return `<p class="center">Točan odgovor: <b>${fmt(q.a)}</b></p><table class="res">${e.map(([p,i])=>`<tr class="${p===w?'win':''}"><td>${esc(nameOf(p))}</td><td>${fmt(i.val)}</td><td>${Math.abs(i.val-q.a)===0?'Pogodak!':'± '+fmt(Math.abs(i.val-q.a))}</td></tr>`).join('')}</table>`;
  }
  if(r.mode==='quiz'){
    const q=QQ[r.qi];const e=Object.entries(r.inputs).sort((a,b)=>a[1].at-b[1].at);
    return `<p class="center">Točno je bilo: <b>${esc(q.o[q.c])}</b></p><table class="res">${e.map(([p,i],k)=>`<tr class="${p===w?'win':''}"><td>${k+1}. ${esc(nameOf(p))}</td><td>${esc(q.o[i.val])}</td><td>${i.val===q.c?'✓':'✗'}</td></tr>`).join('')}</table>`;
  }
  if(r.mode==='race'&&r.final){
    const e=Object.entries(r.final).sort((a,b)=>b[1]-a[1]);
    return `<table class="res">${e.map(([p,n],k)=>`<tr class="${p===w?'win':''}"><td>${k+1}. ${esc(nameOf(p))}</td><td>🦌</td><td>${n} / ${GOAL}</td></tr>`).join('')}</table>`;
  }
  if(r.mode==='bomb')return `<p class="center muted">Bomba je proletjela ${r.passes} puta.</p>`;
  return '';
}
function bindStage(prevKey){

  if(S.phase==='play'&&r&&r.mode==='wheel'){
    const g=$('#wg');
    if(g){g.style.transition='none';g.style.transform='rotate(0deg)';g.getBoundingClientRect();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transition='transform 5.6s cubic-bezier(.12,.7,.1,1)';g.style.transform=`rotate(${finalAngle(r)}deg)`}))}
  }

    const go=$('#go'),tb=$('#tapb');
    const cd=()=>{const left=raceGo-Date.now();if(!$('#go'))return;
      if(left>0){go.textContent=Math.ceil(left/1000);setTimeout(cd,100)}
      else{go.textContent='KRENI!';if(tb)tb.disabled=false;setTimeout(()=>{if($('#go'))go.textContent=''},900)}};
    cd();
    if(tb)tb.addEventListener('pointerdown',e=>{e.preventDefault();if(tb.disabled||Date.now()<raceGo||raceN>=GOAL)return;raceN++;patch({race:{rid:raceRid,n:raceN}});if(isHost)hostSync();updateStage()});

  if(pb)pb.onclick=()=>{pb.disabled=true;myPass={rid:r.id,k:r.passes};patch({pass:myPass});if(isHost)hostSync()};
  const rb=$('#roll');
  if(rb)rb.onclick=()=>{
    if(submitted()||rolling)return;rolling=true;rb.disabled=true;
    const d=$('#mydice');const iv=setInterval(()=>{d.textContent=DIE[rnd6()]+DIE[rnd6()]},80);
    setTimeout(()=>{clearInterval(iv);rolling=false;const v=[rnd6(),rnd6()];d.textContent=DIE[v[0]]+DIE[v[1]];sendInput(v)},1000);
  };
  const gf=$('#gf');
  if(gf)gf.onsubmit=e=>{e.preventDefault();if(submitted()!==null)return;const v=parseFloat($('#gv').value.replace(/\s/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));if(!Number.isFinite(v))return;sendInput(v)};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(submitted()!==null)return;sendInput(+b.dataset.i)});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(!r)return;myWho={rid:r.id,vote:b.dataset.v,claim:false};patch({who:myWho});if(isHost)hostSync();stageKey='';renderStage()});
  const cl=$('#claim');
  if(cl)cl.onclick=()=>{if(!r)return;myWho={rid:r.id,vote:null,claim:true};patch({who:myWho});if(isHost)hostSync();stageKey='';renderStage()};
  const wasResult=prevKey&&prevKey.split('|')[0]==='result';
  if(S.phase==='result'&&S.result&&S.result.winner&&!wasResult)confetti();
  if(S.phase==='whores'&&!(prevKey&&prevKey.startsWith('whores')))confetti();
}
function updateStage(){
  const r=S.round;if(!r)return;
  if(S.phase==='who'){
    const dyn=$('#dyn');if(!dyn)return;
    const voters=Object.keys(r.votes).length,total=Object.keys(S.players).length-1-(r.claim?1:0);
    dyn.innerHTML=`<p class="muted" style="margin-top:14px">Glasovalo: ${voters} od ${Math.max(total,voters)} · ${r.claim?'Tajni Djed Božićnjak se javio ✓':'Tajni Djed Božićnjak se još nije javio …'}</p>`;
    return;
  }
  if(S.phase!=='play')return;
  const mine=submitted();
  if(r.mode==='race'){
    const lanes=$('#lanes');if(!lanes)return;
    lanes.innerHTML=r.active.map(p=>{
      let n=0;
      if(p===myId)n=raceRid===rid(r)?raceN:0;
      else{const pr=peerOf(p);const rc=pr&&pr.presence.race;if(rc&&rc.rid===rid(r))n=Math.min(GOAL,+rc.n||0)}
      const pct=6+88*n/GOAL;
      return `<div class="lane ${p===myId?'me':''}"><span class="ln">${esc(nameOf(p))}${p===myId?' (ti)':''}</span><span class="deer" style="left:${pct}%">🦌</span><span class="flag">🏁</span></div>`;
    }).join('');
    const tb=$('#tapb');if(tb&&Date.now()>=raceGo)tb.textContent=`TAPKAJ! 🦌 ${raceN}/${GOAL}`;
  }
  if(r.mode==='dice'){
    const rb=$('#roll'),d=$('#mydice');
    if(mine&&rb&&!rolling){rb.style.display='none';d.textContent=DIE[mine[0]]+DIE[mine[1]]}
    const dyn=$('#dyn');
    if(dyn)dyn.innerHTML=`<div class="chips">${r.active.map(p=>{const i=r.inputs[p];return `<span class="chip ${i?'ok':''}">${esc(nameOf(p))}: ${i?DIE[i.val[0]]+DIE[i.val[1]]+' '+(i.val[0]+i.val[1]):'baca …'}</span>`}).join('')}</div>`;
  }
  if(r.mode==='guess'||r.mode==='quiz'){
    if(r.mode==='guess'&&mine!==null){const gb=$('#gbox');if(gb)gb.innerHTML=`<p>Tvoja procjena: <b>${fmt(mine)}</b> ✓</p>`}
    if(r.mode==='quiz'&&mine!==null)document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.toggle('sel',+b.dataset.i===mine)});
    const got=r.active.filter(p=>r.inputs[p]).length,dyn=$('#dyn');
    if(dyn)dyn.innerHTML=`<p class="muted" style="margin-top:12px">${got} od ${r.active.length} ${r.mode==='guess'?'poslalo je procjenu':'je odgovorilo'}</p><div class="chips">${r.active.map(p=>`<span class="chip ${r.inputs[p]?'ok':''}">${r.inputs[p]?'✓ ':''}${esc(nameOf(p))}</span>`).join('')}</div>`;
  }
}
function finalAngle(r){const i=Math.max(0,r.pool.indexOf(r.winner)),seg=360/r.pool.length;return r.turns*360-(i+0.5+r.jit)*seg}
function wheelSVG(pool,rot){
  const N=pool.length,seg=360/N,c=150,R=142;
  const pt=(a,rr)=>[c+rr*Math.sin(a*Math.PI/180),c-rr*Math.cos(a*Math.PI/180)];
  let s='';
  pool.forEach((p,i)=>{
    const a0=i*seg,a1=(i+1)*seg,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R);
    let col=COLS[i%COLS.length];if(i===N-1&&i%COLS.length===0)col=COLS[2];
    s+=`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${seg>180?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${col}" stroke="#fbf6ec" stroke-width="2"/>`;
    let nm=nameOf(p);if(nm.length>11)nm=nm.slice(0,10)+'…';
    s+=`<text transform="rotate(${(a0+seg/2-90).toFixed(2)} ${c} ${c})" x="${c+34}" y="${c+5}" font-family="Inter,sans-serif" font-size="${N>7?13:15}" font-weight="700" fill="#fff">${esc(nm)}</text>`;
  });
  return `<div class="wheelwrap"><div class="pointer">▼</div><svg viewBox="0 0 300 300" class="wheel" role="img" aria-label="Kolo sreće"><circle cx="150" cy="150" r="148" fill="#d4a017"/><g id="wg" style="transform-origin:150px 150px;transform:rotate(${rot}deg)">${s}</g><circle cx="150" cy="150" r="24" fill="#fbf6ec" stroke="#d4a017" stroke-width="3"/><text x="150" y="158" text-anchor="middle" font-size="22">🎄</text></svg></div>`;
}

  }
  if(S.phase==='result'){
    if(S.result&&S.result.winner)h+=`<button class="btn red big" data-a="opened">✓ ${esc(nameOf(S.result.winner))} je otvorio/la → Tko je bio tajni Djed?</button><button class="btn" data-a="openedSkip" style="width:100%;margin-bottom:8px">✓ Otvoreno, bez pogađanja</button><button class="btn ghost" data-a="task">🔀 Drugi zadatak</button> <button class="btn ghost" data-a="abort">Ne računaj</button>`;
    else h+='<button class="btn red big" data-a="again">Novo pitanje</button><button class="btn ghost" data-a="abort">Natrag</button>';
  }
  if(S.phase==='who'&&r){
    h+=`<button class="btn red big" data-a="reveal" ${r.claim?'':'disabled'}>Otkrij tajnog Djeda (${Object.keys(r.votes).length} glasova)</button>`;
    if(!r.claim){const man=Object.keys(S.players).filter(p=>isManual(p)&&p!==r.opener);if(man.length)h+=`<p class="muted" style="font-size:14px">Tajni Djed nema račun? Označi ga:</p><div class="names" style="margin-bottom:8px">${man.map(p=>`<button class="nm" data-cl="${esc(p)}">${esc(nameOf(p))}</button>`).join('')}</div>`}
    h+='<button class="btn ghost" data-a="next">Preskoči</button>';
  }
  if(S.phase==='whores')h+='<button class="btn red big" data-a="next">Dalje ➜</button>';
  if(S.phase==='done')h+='<p>Igra je završena. 🎄</p>'+(rem.length?'<button class="btn" data-a="reopen">Ipak nastavi</button>':'');
  h+=`<details class="manage" ${manageOpen?'open':''}><summary>Igrači i postavke</summary>
    <p class="muted" style="margin-top:8px;font-size:14px">Netko nema Claude račun? Dodaj ga ovdje – sudjeluje u Kolu sreće, kockama i bombi (aplikacija baca i dodaje umjesto njega).</p>
    <div class="names">${NAMES.filter(n=>!Object.values(S.players).some(v=>v.name===n)).map(n=>`<button class="nm" data-add="${esc(n)}">+ ${esc(n)}</button>`).join('')||'<span class="muted">Svih 9 je tu 🎉</span>'}</div>
    <ul class="mlist">${Object.keys(S.players).map(p=>`<li><span>${esc(nameOf(p))}${isManual(p)?' (bez računa)':''}${S.order.includes(p)?' ✅':''}</span><button class="link" data-rm="${esc(p)}">ukloni</button></li>`).join('')}</ul>
    ${Date.now()<TARGET.getTime()?`<button class="btn ghost" data-a="lock" style="margin-bottom:6px">${S.open?'🔒 Ponovno zaključaj (ostali vide odbrojavanje)':'🔓 Otključaj za sve (test)'}</button><br>`:''}
    <button class="btn ghost" data-a="reset">${confirmReset?'Sigurno? Klikni opet':'Resetiraj redoslijed i bodove'}</button></details></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startRound(b.dataset.m));
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(b.dataset.a==='lock')commit(n=>{n.open=!n.open});else hostAction(b.dataset.a)});
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removePlayer(b.dataset.rm));
  el.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>claimFor(b.dataset.cl));
  el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const v=b.dataset.add;const id='m-'+newId();commit(n=>{n.players[id]={name:v,j:Date.now()}})});
  const d=el.querySelector('details');d.ontoggle=()=>{manageOpen=d.open};
}
function renderPlayers(){
  const el=$('#players'),ids=Object.keys(S.players).sort((a,b)=>(S.players[a].j||0)-(S.players[b].j||0));
  if(!ids.length){el.innerHTML='';return}
  const on=new Set(peers.filter(p=>p.presence&&p.presence.nick).map(pidOf));
  el.innerHTML=`<div class="card"><h3>Ekipa (${ids.length})</h3><ul class="plist">${ids.map(p=>{const k=S.order.indexOf(p);const sc=S.scores&&S.scores[p];return `<li class="${k>=0?'done':''}"><span class="dot ${isManual(p)?'man':on.has(p)?'on':''}"></span><span class="pn">${esc(nameOf(p))}${p===myId?' <em class="muted">(ti)</em>':''}</span>${sc?`<span class="muted" style="font-size:13px">🕵️ ${sc}</span>`:''}<span>${k>=0?'✅ #'+(k+1):'🎁'}</span></li>`}).join('')}</ul></div>`;
}
function renderRx(){
  const el=$('#rxbar');
  if(!room||!myNick){el.innerHTML='';return}
  if(el.firstChild)return;
  el.innerHTML=`<div class="rx">${RX.map(e=>`<button data-rx="${e}" aria-label="Reakcija ${e}">${e}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>sendReact(b.dataset.rx));
}

// ================= Ukrasi =================
function flyEmoji(e,who){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const s=document.createElement('div');s.className='fly';s.style.left=(10+Math.random()*80)+'%';
  s.innerHTML=esc(e)+(who?`<small>${esc(who)}</small>`:'');document.body.appendChild(s);setTimeout(()=>s.remove(),2700);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=COLS[i%5];s.style.animationDelay=(Math.random()*.6)+'s';s.style.animationDuration=(2.2+Math.random()*1.6)+'s';box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),4800);
}
(()=>{const sn=$('#snow');for(let i=0;i<22;i++){const f=document.createElement('i');f.textContent='❄';f.style.left=Math.random()*100+'%';f.style.fontSize=(8+Math.random()*12)+'px';f.style.animationDuration=(9+Math.random()*12)+'s';f.style.animationDelay=(-Math.random()*20)+'s';sn.appendChild(f)}})();
</script>
